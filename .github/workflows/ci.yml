name: quality-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (ignore package scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
